### model
# model_name_or_path: ../../data/jinghong_chen/Qwen2-VL-7B-Instruct_EVQA-RAG1_LoRA-SFT
model_name_or_path: Qwen/Qwen2-VL-2B-Instruct

### method
stage: attn_sft
do_train: true
finetuning_type: lora
lora_target: all

### dataset
# dataset: evqa-rag5_answer-attn_sft-size=64000-max=4096 # video: mllm_video_demo
dataset: evqa-rag5_answer-attn_sft-source_span=question-cali_span=question_token-size=64000-max=4096 # video: mllm_video_demo
template: qwen2_vl
cutoff_len: 4096 # set to 8192 for long context 
max_samples: 200000
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: saves/qwen2_vl-2b/lora/evqa/attn/rag5_answer-attn_sft-sum-source_span=question-cali_span=question_token-size=1000-max=4096
logging_steps: 10 # 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 32 # 32
learning_rate: 1.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
attn_aggregate: sum
remove_small_attn: false

### eval
val_size: 0.0001
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500
