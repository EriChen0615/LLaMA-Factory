### model
model_name_or_path: ../../data/jinghong_chen/Qwen2-VL-2B-Instruct_EVQA-BEFT[K=2*]-l0h4-size=64000-max=2048 
ref_model: ../../data/jinghong_chen/Qwen2-VL-2B-Instruct_EVQA-BEFT[K=2*]-l0h4-size=64000-max=2048
ppl_prior_head_path: ../../data/jinghong_chen/Qwen2-VL-2B-Instruct_EVQA-BEFT[K=2*]-l0h4-size=64000-max=2048/prior_head.pt
ppl_prior_modeling: mlp_head
ppl_prior_head_num_of_layers: 2
ppl_prior_head_proj_dim: 1024
ppl_hidden_state_offset: 4

### method
stage: bepo
do_train: true
finetuning_type: lora
lora_target: all
pref_beta: 0.7
pref_loss: sigmoid

ppl_prior_loss_type: logistic
ppl_prior_loss_factor: 1.0
use_prior_head_loss: true

### dataset
dataset: debug-evqa-bepo[K=2]-model=beft[K=2*]-l0h4 # video: mllm_video_demo
template: qwen2_vl
cutoff_len: 8192 # set to 8192 for long context 
# max_samples: 200000 # 200000
max_samples: 10 # 200000
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: saves/qwen2_vl-2b/lora/evqa/bepo/debug-evqa-beft[K=2*]-l0h4-bepo[K=2]_beta=0.7
logging_steps: 1
save_steps: 500
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
# gradient_accumulation_steps: 32
gradient_accumulation_steps: 2 
learning_rate: 5.0e-6
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### eval
val_size: 0.001
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500
