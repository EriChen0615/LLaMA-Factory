### model
# model_name_or_path: ../../data/jinghong_chen/Qwen2-VL-7B-Instruct_EVQA-RAG1_LoRA-SFT
model_name_or_path: Qwen/Qwen2-VL-7B-Instruct

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 64

### dataset
dataset: slidevqa-rag4-sft-size=128-offset=0-max=2048
template: qwen2_vl
cutoff_len: 8192 # set to 8192 for long context 
max_samples: 128
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: saves/qwen2_vl-7b/lora/slidevqa/sft/rag4-slidevqa-sft-r64-bs8-size=128-max=8192
logging_steps: 10
save_steps: 50
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 1  # effective batch size = 4
learning_rate: 1.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### eval
val_size: 0.0001
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 50

