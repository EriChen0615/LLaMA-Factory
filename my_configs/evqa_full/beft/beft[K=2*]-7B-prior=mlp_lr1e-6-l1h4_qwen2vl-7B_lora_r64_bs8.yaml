### model
# model_name_or_path: ../../data/jinghong_chen/Qwen2-VL-7B-Instruct_EVQA-RAG1_LoRA-SFT
model_name_or_path: Qwen/Qwen2-VL-7B-Instruct

### method
stage: ppl
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 64
ppl_hidden_state_offset: 4
ppl_prior_loss_factor: 1.0
ppl_prior_loss_type: logistic
prior_head_lr: 1.0e-6

use_ppl_loss: true
ppl_loss_type: ensemble
ppl_prior_modeling: mlp_head
use_prior_head_loss: true
ppl_prior_head_num_of_layers: 2
ppl_prior_head_proj_dim: 1024

### dataset
dataset: evqa-rag2-answer-ppl-size=0-max=2048 # video: mllm_video_demo
template: qwen2_vl
cutoff_len: 4096 # set to 8192 for long context 
max_samples: 200000
# max_samples: 64
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: saves/qwen2_vl-7b/lora/evqa/beft/beft[K=2*]-prior=mlp-lr1e-6-l1h4-r64-size=0-max=2048
logging_steps: 10 # 10
# save_steps: 5 # 500
save_steps: 2000 # 500
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 4  # effective batch size = 32
learning_rate: 1.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000


### eval
val_size: 0.0001
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500
